name: Product Service CI/CD

on:
  push:
    paths:
      - "productService/**"
      - ".github/workflows/product-service-ci.yml"
  pull_request:
    paths:
      - "productService/**"
      - ".github/workflows/product-service-ci.yml"

concurrency:
  group: product-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICE_DIR: productService
  IMAGE_NAME: cloudstore-product-service

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: productService
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: product_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d product_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL_LOCAL: jdbc:postgresql://localhost:5432/product_ci
      DB_USERNAME_LOCAL: ci
      DB_PASSWORD_LOCAL: ci
      JWT_SECRET_KEY: ci-test-jwt-secret-key-min-32-chars-long!!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: productService/pom.xml

      - name: Maven verify
        run: chmod +x mvnw && ./mvnw -B verify

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: productService
        run: docker build -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        working-directory: productService
        run: |
          docker tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          fi

  deploy-ec2:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCT_EC2_HOST }}
          username: ${{ secrets.PRODUCT_EC2_USER }}
          key: ${{ secrets.PRODUCT_EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            docker pull "$IMAGE"
            docker stop cloudstore-product || true
            docker rm cloudstore-product || true
            docker run -d \
              --name cloudstore-product \
              -p 8082:8082 \
              --restart unless-stopped \
              --env-file /opt/cloudstore/product.env \
              "$IMAGE"
