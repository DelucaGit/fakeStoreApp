spring.application.name=productService
spring.config.import=optional:file:.env.local[.properties]

# Server config
server.port=8082

# Database connection
spring.datasource.url=${DB_URL_LOCAL}
spring.datasource.username=${DB_USERNAME_LOCAL}
spring.datasource.password=${DB_PASSWORD_LOCAL}

# 1. DATABASE & FLYWAY
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# 2. NAMNGIVNING (Mappar 'imageUrl' i Java till 'image_url' i DB)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# 3. LOGGNING & DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jpa=INFO

# FakeStore API (HTTPS). Use a current JDK 21 (Temurin/Corretto) so the default trust store
# validates fakestoreapi.com in both local dev and production. Point your IDE run configuration
# at the same JDK as JAVA_HOME. If PKIX errors persist, check HTTPS scanning (AV/proxy) or
# import the required CA into that JDK's cacerts—do not disable TLS in production.
fakestore.base-url=https://fakestoreapi.com
# Dev-only last resort; must stay false (unset) in production. Startup fails if prod profile
# is active and this is true (see FakeStoreTlsProductionGuard).
fakestore.ssl.insecure=${FAKESTORE_SSL_INSECURE:false}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT
jwt.access.secretkey=${JWT_ACCESS_SECRET_KEY:${JWT_SECRET_KEY}}
